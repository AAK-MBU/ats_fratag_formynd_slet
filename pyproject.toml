[project]
name = "ats-fratag-formynd-slet"
version = "0.1.0"
description = "Natlig sletteproces der sletter lukkede formynd-sager, hvis slutdato ligger mere end 30 dage tilbage."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "automation-server-client @ git+https://github.com/odense-rpa/automation-server-client.git",
    "mbu-rpa-core @ git+https://github.com/AAK-MBU/MBU-rpa-core.git",
    "pillow",
    "pyodbc>=5.3.0",
    "python-dotenv",
    "requests",
    "sqlalchemy>=2.0",
    "tzdata",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
automation-server-client = { git = "https://github.com/odense-rpa/automation-server-client.git", tag = "v0.2.0" }
mbu-rpa-core = { git = "https://github.com/AAK-MBU/MBU-rpa-core.git", tag = "v0.2.5" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["ats_framework*"]

[tool.ruff]
target-version = "py313"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "uv.lock",
  ".env",
]

[tool.ruff.lint]
ignore = ["E501", "E251"]
select = [
  "F",    # Pyflakes
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "I",    # isort (import sorting)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "TC",   # flake8-type-checking
  "ARG",  # flake8-unused-arguments
  "DTZ",  # enforce timezone-aware datetimes
  "SIM",  # flake8-simplify
  "PL",   # pylint (subset)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.lint.isort]
# Keep imports tidy and deterministic
known-first-party = ["ats_framework"]

[tool.ruff.format]
# Use the formatter; CI step already checks it with `ruff format --check .`

[tool.pyright]
include = ["."]
exclude = [
  "venv",
  ".venv",
  "build",
  "dist",
  "__pycache__"
]
pythonVersion = "3.13"
typeCheckingMode = "basic"   # or "strict"
reportMissingTypeStubs = false
